spring.application.name=merchandise-inventory-service
server.port=${SERVER_PORT:8080}

app.persistence.type=${PERSISTENCE_TYPE:jpa}

spring.datasource.url=jdbc:h2:mem:inventory
spring.datasource.username=sa
spring.datasource.password=

spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.web.locale=pt_BR
spring.web.locale-resolver=fixed

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.data.web.pageable.max-page-size=100

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

logging.level.com.mateus.merchandiseinventory=${LOG_LEVEL:INFO}
logging.pattern.correlation=[%X{requestId:-}]\u0020
